name: Publicar en GitHub Pages

# Solo manual: se dispara desde la API cuando el repo permita escribir
# con el token del workflow. Asi no deja corridas fallidas en cada push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar y configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar la raíz del repo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
