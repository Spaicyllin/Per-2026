<style>
:root{
  --lino:#F2E7D3; --tarjeta:#FBF6EA; --azul:#1E3A5C; --carmin:#98252B;
  --pino:#3A5C42; --oro:#C08A1E; --tinta:#241C14;
  --linea:rgba(36,28,20,.16);
  --titulo:Georgia,"Times New Roman",serif;
  --cuerpo:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--lino); color:var(--tinta); font-family:var(--cuerpo);
  font-size:16px; line-height:1.45; padding-bottom:96px;
  -webkit-text-size-adjust:100%;
}
.marco{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3,h4{font-family:var(--titulo);margin:0;line-height:1.2}
p{margin:.4em 0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
svg.cenefa{display:block;width:100%;height:12px}

/* ---------- encabezado ---------- */
header.top{padding:12px 0 10px}
.marca{display:flex;align-items:center;gap:10px}
.marca .sello{flex:0 0 34px;width:34px;height:34px}
.marca h1{font-size:27px;color:var(--azul);letter-spacing:.2px}
.marca .sub{font-size:12.5px;color:var(--pino);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.engranaje{
  margin-left:auto;background:var(--tarjeta);border:1px solid var(--linea);
  border-radius:11px;width:42px;height:42px;display:grid;place-items:center;padding:0;
}
.engranaje svg{width:21px;height:21px;display:block}

/* ---------- tarjetas ---------- */
.tarjeta{
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;
  padding:14px;margin:12px 0;box-shadow:0 1px 0 rgba(36,28,20,.05);
}
.tarjeta.pulsable{width:100%;text-align:left;display:block}
.tarjeta h3{font-size:19px;color:var(--azul)}
.meta{font-size:13.5px;color:rgba(36,28,20,.72);margin-top:3px}
.muted{color:rgba(36,28,20,.6);font-size:14px}
.chip{
  display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;
  border:1px solid currentColor;letter-spacing:.02em;
}
.chip.ok{color:var(--pino)}
.chip.no{color:var(--carmin)}
.chip.reloj{color:var(--oro);border-color:rgba(192,138,30,.55);background:rgba(192,138,30,.1)}
.hilo{height:1px;background:var(--linea);border:0;margin:12px 0}
.aviso{
  background:rgba(152,37,43,.08);border:1px solid rgba(152,37,43,.35);
  border-radius:12px;padding:11px 13px;margin:12px 0;font-size:14px;color:var(--carmin)
}
.aviso.oro{background:rgba(192,138,30,.12);border-color:rgba(192,138,30,.45);color:#7a5711}
.aviso.pino{background:rgba(58,92,66,.1);border-color:rgba(58,92,66,.4);color:var(--pino)}

/* ---------- botones ---------- */
.btn{
  display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--azul);
  background:var(--azul);color:#FBF6EA;font-weight:650;font-size:16.5px;margin-top:10px;
}
.btn:disabled{opacity:.45}
.btn.sec{background:transparent;color:var(--azul)}
.btn.carmin{background:var(--carmin);border-color:var(--carmin);color:#FBF6EA}
.btn.chico{padding:10px;font-size:14.5px;font-weight:600}
.fila{display:flex;gap:8px}
.fila>*{flex:1;margin-top:10px}

/* ---------- registro ---------- */
input[type=search],input[type=text],input[type=password],input[type=datetime-local],select,textarea{
  width:100%;padding:12px;font-family:inherit;font-size:16px;color:var(--tinta);
  background:#fff;border:1px solid var(--linea);border-radius:11px;
}
textarea{min-height:76px;resize:vertical}
label.campo{display:block;font-size:13px;font-weight:650;color:var(--azul);margin:12px 0 5px}
.lista{margin-top:10px;max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch}
button.nombre{
  display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:7px;
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:11px;
  font-size:16px;color:var(--tinta);
}

/* ---------- menú / opciones ---------- */
.tiempo{margin:18px 0 0}
.tiempo .cab{display:flex;align-items:baseline;gap:8px}
.tiempo .num{
  flex:0 0 24px;width:24px;height:24px;border-radius:7px;background:var(--azul);color:#FBF6EA;
  font-size:13px;font-weight:700;display:grid;place-items:center;font-family:var(--cuerpo)
}
.tiempo h4{font-size:16.5px;color:var(--azul)}
.tiempo .regla{font-size:12px;color:rgba(36,28,20,.6);margin:4px 0 8px 32px}
button.opcion{
  display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;
  background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:12px;color:var(--tinta);
}
button.opcion .n{display:block;font-weight:650;font-size:15.5px}
button.opcion .d{display:block;font-size:13px;color:rgba(36,28,20,.65);margin-top:2px}
button.opcion[aria-pressed=true]{
  border-color:var(--pino);background:rgba(58,92,66,.12);box-shadow:inset 0 0 0 1px rgba(58,92,66,.4)
}
button.opcion[aria-pressed=true] .n::before{content:"✓ ";color:var(--pino);font-weight:700}
.estado{font-size:13.5px;margin:14px 0 0;min-height:20px}
.estado.err{color:var(--carmin)}
.estado.ok{color:var(--pino)}

/* ---------- grupo ---------- */
.selector button{
  display:block;width:100%;text-align:left;padding:12px 13px;margin-bottom:8px;
  background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:11px;color:var(--tinta);font-size:15px
}
.selector button[aria-pressed=true]{border-color:var(--azul);background:rgba(30,58,92,.1);font-weight:650}
.conteo{margin:11px 0 0}
.conteo .lbl{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.conteo .lbl b{font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:5px;background:rgba(36,28,20,.1);margin:5px 0 4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--azul);border-radius:5px}
.quienes{font-size:12.5px;color:rgba(36,28,20,.66)}
.grande{font-size:22px;font-family:var(--titulo);color:var(--azul)}
ol.unoauno{padding-left:22px;margin:8px 0 0}
ol.unoauno li{margin-bottom:11px;font-size:14.5px}
ol.unoauno .t{color:rgba(36,28,20,.72);font-size:13.5px}
ol.unoauno .obs{color:var(--carmin);font-size:13px}
.caja{background:rgba(152,37,43,.06);border:1px dashed rgba(152,37,43,.4);border-radius:12px;padding:11px 13px;margin-top:12px}
.caja h4{color:var(--carmin);font-size:15px}
.caja p{font-size:13.5px;color:rgba(36,28,20,.78)}

/* ---------- pestañas ---------- */
nav.pestanas{
  position:fixed;left:0;right:0;bottom:0;background:var(--lino);
  box-shadow:0 -6px 18px rgba(36,28,20,.08);padding-bottom:env(safe-area-inset-bottom)
}
nav.pestanas .tres{max-width:560px;margin:0 auto;display:flex}
nav.pestanas button{
  flex:1;background:none;border:0;padding:11px 4px 13px;color:rgba(36,28,20,.55);
  font-size:12.5px;font-weight:600;display:grid;gap:3px;justify-items:center
}
nav.pestanas button svg{width:22px;height:22px;display:block}
nav.pestanas button[aria-current=page]{color:var(--azul)}
nav.pestanas button[aria-current=page] .pt{font-weight:750}
pre.diag{
  background:#fff;border:1px solid var(--linea);border-radius:11px;padding:11px;
  font-size:12px;line-height:1.5;overflow:auto;white-space:pre-wrap;word-break:break-word
}
.volver{
  background:none;border:0;padding:10px 0;color:var(--azul);font-size:14.5px;font-weight:650
}
.cargando{text-align:center;color:rgba(36,28,20,.55);padding:26px 0;font-size:14.5px}
</style>

function h(tag, props, kids){
  var n = document.createElement(tag), k, v, i, c;
  if(props) for(k in props){
    v = props[k];
    if(v===null || v===undefined || v===false) continue;
    if(k==='class') n.className = v;
    else if(k==='text') n.textContent = v;
    else if(k==='html') n.innerHTML = v;
    else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true ? '' : v);
  }
  if(kids){
    kids = [].concat(kids);
    for(i=0;i<kids.length;i++){
      c = kids[i];
      if(c===null || c===undefined || c===false || c==='') continue;
      n.appendChild(typeof c==='object' ? c : document.createTextNode(String(c)));
    }
  }
  return n;
}

}

function sbFetch(path, opts){
  opts = opts || {};
  var ctl = new AbortController();
  var t = setTimeout(function(){ ctl.abort(); }, TIMEOUT);
  var headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json'
  };
  if(opts.headers) for(var k in opts.headers) headers[k] = opts.headers[k];
  return fetch(SB_URL + '/rest/v1' + path, {
    method: opts.method || 'GET', headers: headers, body: opts.body,
    signal: ctl.signal, cache: 'no-store'
  }).then(function(r){
    if(!r.ok){
      return r.text().catch(function(){ return ''; }).then(function(d){
        throw new Error('HTTP ' + r.status + (d ? ' — ' + d.slice(0,180) : ''));
      });
    }
    if(opts.raw) return true;
    return r.text().then(function(txt){ return txt ? JSON.parse(txt) : null; });
  }).then(function(v){ clearTimeout(t); return v; },
          function(e){ clearTimeout(t); throw e; });
}
function cloudGet(key){
  return sbFetch('/mesa?select=value&key=eq.' + encodeURIComponent(key)).then(function(rows){
    return (rows && rows[0]) ? rows[0].value : null;
  });
}
function cloudList(prefix){
  return sbFetch('/mesa?select=key,value&key=like.' + encodeURIComponent(prefix + '*')).then(function(rows){

  });
}
function cloudSet(key, value){
  var intento = 0, ultimo = null;
  function ir(){
    intento++;
    return sbFetch('/mesa?on_conflict=key', {
      method:'POST',
      headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ key:key, value:value, updated_at:new Date().toISOString() }]),
      raw:true
    }).catch(function(e){
      ultimo = e;
      if(intento >= 3) throw ultimo;
      return sleep(400 * intento).then(ir);
    });
  }
  return ir();
}
function cloudDel(key){
  return sbFetch('/mesa?key=eq.' + encodeURIComponent(key), { method:'DELETE', raw:true });

}
function metaDe(id){
  var m = (STATE && STATE.meta && STATE.meta[id]) || {};
  var base = menuPorId(id) || {};
  return { when: m.when || '', place: m.place || base.place || '', close: m.close || '' };
}
function cierreMs(id){
  var c = metaDe(id).close;
  if(!c) return null;
  var d = new Date(c);
  return isNaN(d.getTime()) ? null : d.getTime();
}
function vencido(id){ var c = cierreMs(id); return c !== null && Date.now() > c; }
function estaViva(id){ return STATE.open.indexOf(id) >= 0 && !vencido(id); }
function esPasada(id){
  var conocida = STATE.open.indexOf(id) >= 0 || STATE.closed.indexOf(id) >= 0;
  return conocida && (STATE.closed.indexOf(id) >= 0 || vencido(id));
}
function menusVivos(){
  return STATE.open.filter(estaViva).map(menuPorId).filter(Boolean).sort(function(a,b){
    var ca = cierreMs(a.id), cb = cierreMs(b.id);
    if(ca === null) return 1; if(cb === null) return -1;
    return ca - cb;
  });
}
function menusPasados(){
  return unicos(STATE.open.concat(STATE.closed)).filter(esPasada).map(menuPorId).filter(Boolean).sort(function(a,b){
    return (cierreMs(b.id) || 0) - (cierreMs(a.id) || 0);
  });
}
function textoCuenta(ms){
  if(ms === null) return '';
  var d = ms - Date.now();
  if(d <= 0) return 'cerrado';
  var min = Math.floor(d/60000), hh = Math.floor(min/60), dd = Math.floor(hh/24);
  if(dd >= 1) return 'cierra en ' + dd + ' d ' + (hh%24) + ' h';
  if(hh >= 1) return 'cierra en ' + hh + ' h ' + (min%60) + ' min';
  return 'cierra en ' + min + ' min';
}
function clavePedido(menuId, personaId){ return 'r_' + limpiaClave(menuId) + '__' + limpiaClave(personaId); }
function nuevoPersonaId(nombre){ return slug(nombre) + '-' + rand4(); }

function pedidosDe(menuId, forzar){
  var pre = 'r_' + limpiaClave(menuId) + '__';
  if(!forzar && CACHE[pre]) return Promise.resolve(CACHE[pre]);
  return cloudList(pre).then(function(rows){
    var out = rows.map(function(r){ return r.value; }).filter(function(v){ return v && v.name; });
    out.sort(function(a,b){ return slug(a.name) < slug(b.name) ? -1 : 1; });
    CACHE[pre] = out;
    return out;
  });
}
function miPedido(menuId){
  if(!YO) return Promise.resolve(null);
  return cloudGet(clavePedido(menuId, YO.id)).catch(function(){
    var p = LS.get('pend_' + clavePedido(menuId, YO.id), null);
    return p ? p.value : null;
  });
}
function subirPendientes(){
  var ks = LS.keys().filter(function(k){ return k.indexOf('pend_') === 0; });
  return ks.reduce(function(p, k){
    return p.then(function(){
      var rec = LS.get(k, null);
      if(!rec || !rec.key){ LS.del(k); return; }
      return cloudSet(rec.key, rec.value).then(function(){ LS.del(k); }, function(){});
    });
  }, Promise.resolve());
}

   ========================================================= */
function vistaRegistro(root){
  root.textContent = '';
  root.appendChild(h('h2', {text:'Busca tu nombre', style:'font-size:21px;color:#1E3A5C'}));
  root.appendChild(h('p', {class:'muted', text:'Solo una vez en este teléfono. Después entras directo.'}));

  // El campo NO se redibuja al escribir: solo se repinta la lista de abajo.
  var input = h('input', {type:'search', placeholder:'Busca tu nombre…', autocomplete:'off',
                          autocapitalize:'words', 'aria-label':'Busca tu nombre'});
  var lista = h('div', {class:'lista'});
  function pintar(){
    var q = slug(input.value), i;
    lista.textContent = '';
    var items = PEOPLE.filter(function(n){ return !q || q==='x' || slug(n).indexOf(q) >= 0; });
    if(!items.length){
      lista.appendChild(h('p', {class:'muted', text:'Ningún nombre coincide. Usa «No estoy en la lista».'}));
      return;
    }
    for(i=0;i<items.length;i++){
      (function(n){
        lista.appendChild(h('button', {class:'nombre', onclick:function(){ entrar(n); }}, n));
      })(items[i]);
    }
  }
  input.addEventListener('input', pintar);
  root.appendChild(h('div', {style:'margin-top:14px'}, [input]));
  root.appendChild(lista);
  pintar();

  root.appendChild(h('hr', {class:'hilo'}));
  root.appendChild(h('button', {class:'btn sec', onclick:function(){
    var n = prompt('Escribe tu nombre completo:');
    if(n && n.trim()) entrar(n.trim());
  }}, 'No estoy en la lista'));
}
function entrar(nombre){
  YO = { id: nuevoPersonaId(nombre), name: nombre };
  LS.set('mesa_me', YO);
  cloudSet('p_' + limpiaClave(YO.id), { id:YO.id, name:nombre, at:new Date().toISOString() })
    .catch(function(){ LS.set('pend_p_' + limpiaClave(YO.id),
      { key:'p_' + limpiaClave(YO.id), value:{ id:YO.id, name:nombre, at:new Date().toISOString() } }); });
  VISTA = { tab:'hoy', menu:null, grupo:null, pantalla:null, pasada:null };
  render();
}

function vistaHoy(root){

  root.textContent = '';

  if(!vivos.length){
    root.appendChild(h('div', {class:'tarjeta'}, [

  root.appendChild(h('h2', {text:'Para hoy', style:'font-size:21px;color:#1E3A5C'}));

        estado.appendChild(h('span', {class:'chip no', text:'Sin pedir'}));

}

/* =========================================================
   7. VISTA: MENÚ (hacer el pedido)
   ========================================================= */
function vistaMenu(root, menuId, conVolver){
  var m = menuPorId(menuId), meta = metaDe(menuId), cms = cierreMs(menuId);
  root.textContent = '';
  if(!m){ root.appendChild(h('p', {class:'aviso', text:'Ese menú ya no existe.'})); return; }

  if(conVolver) root.appendChild(h('button', {class:'volver',
    onclick:function(){ VISTA.menu = null; render(); }}, '‹ Todas las comidas'));

  root.appendChild(h('h2', {text:m.name, style:'font-size:22px;color:#1E3A5C'}));
  root.appendChild(h('div', {class:'meta', text:meta.when}));
  root.appendChild(h('div', {class:'meta', text:meta.place}));
  root.appendChild(h('div', {style:'margin-top:9px'}, [
    h('span', {class:'chip reloj', 'data-cd':(cms===null?'':String(cms)), text:textoCuenta(cms)})
  ]));
  if(m.incluye) root.appendChild(h('div', {class:'aviso pino', text:m.incluye}));

  var picks = {}, nota = '';
  var estado = h('p', {class:'estado', text:''});
  var boton = h('button', {class:'btn', text:'Guardar mi pedido', disabled:true});
  var areaObs = h('textarea', {placeholder:'Ej.: sin cebolla, poco ají, alergia a los mariscos…',
                               'aria-label':'Observaciones para el restaurante'});

  function refrescarBoton(){
    // Solo cambia texto/atributos: no redibuja la pantalla.
    var faltan = m.courses.filter(function(c){
      return c.options.length > 1 && !picks[c.name];
    });
    if(vencido(menuId)){
      boton.disabled = true; boton.textContent = 'Ya cerró';
      estado.className = 'estado err';
      estado.textContent = 'Esta comida cerró. Ya no se puede guardar.';
      return;
    }
    boton.disabled = faltan.length > 0;
    if(faltan.length){
      estado.className = 'estado';
      estado.textContent = 'Falta elegir: ' + faltan.map(function(c){ return c.name; }).join(', ') + '.';
    } else if(estado.dataset.libre !== '1'){
      estado.className = 'estado';
      estado.textContent = 'Listo para guardar.';
    }
  }

  m.courses.forEach(function(c, idx){
    var obligatorio = c.options.length > 1;
    var bloque = h('div', {class:'tiempo'});
    bloque.appendChild(h('div', {class:'cab'}, [
      h('span', {class:'num', text:String(idx+1)}),
      h('h4', {text:c.name})
    ]));
    bloque.appendChild(h('div', {class:'regla',
      text: obligatorio ? 'Elige 1 · obligatorio' : 'Opcional · tócalo para incluirlo'}));

    var botones = [];
    c.options.forEach(function(o){
      var b = h('button', {class:'opcion', type:'button', 'aria-pressed':'false'}, [
        h('span', {class:'n', text:o.n}),
        o.d ? h('span', {class:'d', text:o.d}) : null
      ]);
      b.addEventListener('click', function(){
        if(vencido(menuId)) { refrescarBoton(); return; }
        var yaEstaba = b.getAttribute('aria-pressed') === 'true';
        if(obligatorio){
          botones.forEach(function(x){ x.setAttribute('aria-pressed','false'); });
          b.setAttribute('aria-pressed','true');
          picks[c.name] = o.n;
        } else {
          b.setAttribute('aria-pressed', yaEstaba ? 'false' : 'true');
          if(yaEstaba) delete picks[c.name]; else picks[c.name] = o.n;
        }
        estado.dataset.libre = '';
        refrescarBoton();
      });
      botones.push(b);
      bloque.appendChild(b);
    });
    bloque.dataset.curso = c.name;
    root.appendChild(bloque);
  });

  root.appendChild(h('label', {class:'campo', text:'Observaciones para el restaurante (opcional)'}));
  root.appendChild(areaObs);
  root.appendChild(estado);
  root.appendChild(boton);

  var extra = h('div');
  root.appendChild(extra);

  // Precarga lo que ya pedí (marcando los botones sin redibujar).
  miPedido(menuId).then(function(p){
    if(p && p.picks){
      picks = JSON.parse(JSON.stringify(p.picks));
      nota = p.note || '';
      areaObs.value = nota;
      Array.prototype.forEach.call(root.querySelectorAll('.tiempo'), function(bl){
        var curso = bl.dataset.curso, elegido = picks[curso];
        Array.prototype.forEach.call(bl.querySelectorAll('button.opcion'), function(b){
          var nom = b.querySelector('.n').textContent;
          b.setAttribute('aria-pressed', nom === elegido ? 'true' : 'false');
        });
      });
      boton.textContent = 'Actualizar mi pedido';
      estado.className = 'estado ok';
      estado.textContent = 'Ya tienes pedido guardado. Puedes cambiarlo hasta el cierre.';
      estado.dataset.libre = '1';
    }
    refrescarBoton();
    if(boton.textContent === 'Guardar mi pedido' && !vencido(menuId) && p && p.picks){
      boton.textContent = 'Actualizar mi pedido';
    }
  }, function(){ refrescarBoton(); });

  boton.addEventListener('click', function(){
    if(vencido(menuId)){ refrescarBoton(); return; }
    var pedido = {
      id: YO.id, name: YO.name, menuId: menuId,
      picks: picks, note: (areaObs.value || '').trim(), at: new Date().toISOString()
    };
    var clave = clavePedido(menuId, YO.id);
    boton.disabled = true;
    estado.className = 'estado'; estado.textContent = 'Guardando…'; estado.dataset.libre = '1';
    extra.textContent = '';
    cloudSet(clave, pedido).then(function(){
      LS.del('pend_' + clave);
      delete CACHE['r_' + limpiaClave(menuId) + '__'];
      estado.className = 'estado ok';
      estado.textContent = '✓ Guardado. Gracias, ' + YO.name.split(' ')[0] + '.';
      boton.disabled = false; boton.textContent = 'Actualizar mi pedido';
    }, function(e){
      var guardoLocal = LS.set('pend_' + clave, { key:clave, value:pedido });
      boton.disabled = false;
      if(guardoLocal){
        estado.className = 'estado err';
        estado.textContent = 'Guardado en tu teléfono, falta subirlo. Vuelve a abrir la app con señal.';
      } else {
        estado.className = 'estado err';
        estado.textContent = 'No se pudo guardar: ' + errTexto(e);
      }
      extra.textContent = '';
      extra.appendChild(h('button', {class:'btn sec chico',
        onclick:function(){ VISTA.pantalla = 'diagnostico'; render(); }}, 'Ver diagnóstico'));
    });
  });
}

/* =========================================================
   8. VISTA: EL GRUPO
   ========================================================= */
function registrados(){
  return cloudList('p_').then(function(rows){
    return rows.map(function(r){ return r.value && r.value.name; }).filter(Boolean);
  }, function(){ return []; });
}
function faltantes(menuId, pedidos, gente){
  var pidieron = {}, i;
  for(i=0;i<pedidos.length;i++) pidieron[slug(pedidos[i].name)] = 1;
  var falta = PEOPLE.filter(function(n){ return !pidieron[slug(n)]; });
  var extras = (gente || []).filter(function(n){
    return !pidieron[slug(n)] && !PEOPLE.some(function(p){ return slug(p) === slug(n); });
  });
  return unicos(falta.concat(extras));
}
function resumenTexto(m, pedidos, falta){
  var meta = metaDe(m.id), L = [];
  L.push('LA MESA · ' + m.name.toUpperCase());
  if(meta.when) L.push(meta.when);
  if(meta.place) L.push(meta.place);
  if(m.incluye) L.push(m.incluye);
  L.push('Pidieron: ' + pedidos.length + ' de ' + TOTAL_GRUPO);
  L.push('');
  L.push('--- CONTEO POR OPCIÓN ---');
  m.courses.forEach(function(c){
    L.push('');
    L.push(c.name.toUpperCase());
    c.options.forEach(function(o){
      var n = pedidos.filter(function(p){ return p.picks && p.picks[c.name] === o.n; }).length;
      if(n > 0) L.push('  ' + n + ' x ' + o.n);
    });
  });
  var conObs = pedidos.filter(function(p){ return p.note; });
  if(conObs.length){
    L.push(''); L.push('--- OBSERVACIONES ---');
    conObs.forEach(function(p){ L.push('  ' + p.name + ': ' + p.note); });
  }
  L.push(''); L.push('--- UNO POR UNO ---');
  pedidos.forEach(function(p, i){
    L.push((i+1) + '. ' + p.name);
    m.courses.forEach(function(c){
      if(p.picks && p.picks[c.name]) L.push('     ' + c.name + ': ' + p.picks[c.name]);
    });
    if(p.note) L.push('     Obs.: ' + p.note);
  });
  if(falta.length){
    L.push(''); L.push('--- FALTAN POR PEDIR (' + falta.length + ') ---');
    L.push('  ' + falta.join(', '));
  }
  return L.join('\n');
}
function descargarCSV(m, pedidos, falta){
  var cols = ['Nombre'].concat(m.courses.map(function(c){ return c.name; })).concat(['Observaciones']);
  function esc(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
  var filas = [cols.map(esc).join(',')];
  pedidos.forEach(function(p){
    filas.push([esc(p.name)]
      .concat(m.courses.map(function(c){ return esc((p.picks && p.picks[c.name]) || ''); }))
      .concat([esc(p.note || '')]).join(','));
  });
  falta.forEach(function(n){
    filas.push([esc(n)]
      .concat(m.courses.map(function(){ return esc('SIN PEDIR'); }))
      .concat([esc('')]).join(','));
  });
  var blob = new Blob(['﻿' + filas.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var a = h('a', {href:URL.createObjectURL(blob), download:'la-mesa-' + m.id + '.csv'});
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copiar(txt, avisar){
  function viejo(){
    var ta = h('textarea', {style:'position:fixed;left:-9999px;top:0'});
    ta.value = txt; document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove(); avisar(ok ? '✓ Copiado. Pégalo donde quieras.' : 'No se pudo copiar. Descarga el CSV.');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ avisar('✓ Copiado. Pégalo donde quieras.'); }, viejo);
  } else viejo();
}

function vistaGrupo(root){
  var vivos = menusVivos();
  root.textContent = '';
  root.appendChild(h('h2', {text:'El grupo', style:'font-size:21px;color:#1E3A5C'}));

  if(!vivos.length){
    root.appendChild(h('p', {class:'muted', text:'No hay comidas abiertas. Mira «Pasadas» para ver las anteriores.'}));
    return;
  }
  if(!VISTA.grupo || !vivos.some(function(m){ return m.id === VISTA.grupo; })) VISTA.grupo = vivos[0].id;

  if(vivos.length > 1){
    var sel = h('div', {class:'selector', style:'margin-top:12px'});
    vivos.forEach(function(m){
      sel.appendChild(h('button', {
        type:'button', 'aria-pressed': m.id === VISTA.grupo ? 'true' : 'false',
        onclick:function(){ VISTA.grupo = m.id; render(); }
      }, m.name + ' · ' + metaDe(m.id).when));
    });
    root.appendChild(sel);
  }
  var cuerpo = h('div');
  root.appendChild(cuerpo);
  pintarGrupo(cuerpo, VISTA.grupo, false);
}

function pintarGrupo(cuerpo, menuId, forzar){
  var m = menuPorId(menuId);
  cuerpo.textContent = '';
  cuerpo.appendChild(h('div', {class:'cargando', text:'Leyendo los pedidos…'}));
  Promise.all([pedidosDe(menuId, forzar), registrados()]).then(function(res){
    var pedidos = res[0], gente = res[1], falta = faltantes(menuId, pedidos, gente);
    cuerpo.textContent = '';

    cuerpo.appendChild(h('div', {class:'tarjeta'}, [
      h('div', {class:'grande', text:pedidos.length + ' de ' + TOTAL_GRUPO + ' ya pidieron'}),
      h('div', {class:'meta', text:m.name + ' · ' + metaDe(menuId).place})
    ]));

    m.courses.forEach(function(c){
      var caja = h('div', {class:'tarjeta'}, [h('h3', {text:c.name})]);
      var hayAlgo = false;
      c.options.forEach(function(o){
        var quien = pedidos.filter(function(p){ return p.picks && p.picks[c.name] === o.n; });
        if(!quien.length) return;
        hayAlgo = true;
        var pct = pedidos.length ? Math.round(quien.length * 100 / pedidos.length) : 0;
        caja.appendChild(h('div', {class:'conteo'}, [
          h('div', {class:'lbl'}, [h('span', {text:o.n}), h('b', {text:String(quien.length)})]),
          h('div', {class:'barra'}, [h('i', {style:'width:' + pct + '%'})]),
          h('div', {class:'quienes', text:quien.map(function(p){ return p.name; }).join(', ')})
        ]));
      });
      if(!hayAlgo) caja.appendChild(h('p', {class:'muted', text:'Nadie ha elegido todavía.'}));
      cuerpo.appendChild(caja);
    });

    var conObs = pedidos.filter(function(p){ return p.note; });
    var cajaObs = h('div', {class:'tarjeta'}, [h('h3', {text:'Observaciones'})]);
    if(conObs.length) conObs.forEach(function(p){
      cajaObs.appendChild(h('p', {style:'font-size:14px;margin:8px 0'}, [
        h('b', {text:p.name + ': '}), p.note
      ]));
    });
    else cajaObs.appendChild(h('p', {class:'muted', text:'Sin observaciones.'}));
    cuerpo.appendChild(cajaObs);

    var cajaUno = h('div', {class:'tarjeta'}, [h('h3', {text:'Uno por uno'})]);
    if(pedidos.length){
      var ol = h('ol', {class:'unoauno'});
      pedidos.forEach(function(p){
        var li = h('li', {}, [h('b', {text:p.name})]);
        m.courses.forEach(function(c){
          if(p.picks && p.picks[c.name])
            li.appendChild(h('div', {class:'t', text:c.name + ': ' + p.picks[c.name]}));
        });
        if(p.note) li.appendChild(h('div', {class:'obs', text:'Obs.: ' + p.note}));
        ol.appendChild(li);
      });
      cajaUno.appendChild(ol);
    } else cajaUno.appendChild(h('p', {class:'muted', text:'Todavía nadie ha pedido.'}));
    cuerpo.appendChild(cajaUno);

    var caja = h('div', {class:'caja'}, [
      h('h4', {text:'Faltan por pedir (' + falta.length + ')'}),
      h('p', {text: falta.length ? falta.join(', ') : '¡Nadie! Los 29 ya pidieron.'})
    ]);
    cuerpo.appendChild(caja);

    var nota = h('p', {class:'estado'});
    cuerpo.appendChild(h('button', {class:'btn sec', onclick:function(){
      copiar(resumenTexto(m, pedidos, falta), function(msg){ nota.className = 'estado ok'; nota.textContent = msg; });
    }}, 'Copiar resumen para el restaurante'));
    cuerpo.appendChild(h('button', {class:'btn sec', onclick:function(){
      descargarCSV(m, pedidos, falta); nota.className = 'estado ok'; nota.textContent = '✓ CSV descargado.';
    }}, 'Descargar listado (CSV)'));
    cuerpo.appendChild(h('button', {class:'btn sec', onclick:function(){
      pintarGrupo(cuerpo, menuId, true);
    }}, 'Actualizar'));
    cuerpo.appendChild(nota);
  }, function(e){

  function paso(nombre, fn){

function parsearMenu(txto){
  var lineas = String(txto || '').split('\n'), courses = [], actual = null, i, l, m, nom, det;
  for(i=0;i<lineas.length;i++){
    l = lineas[i].trim();
    if(!l) continue;
    if(/^[-–•*]/.test(l)){
      if(!actual){ actual = {name:'Opciones', options:[]}; courses.push(actual); }
      m = l.replace(/^[-–•*]\s*/, '');
      var p = m.indexOf(':');
      if(p > 0){ nom = m.slice(0,p).trim(); det = m.slice(p+1).trim(); }
      else { nom = m; det = ''; }
      actual.options.push(det ? {n:nom, d:det} : {n:nom});
    } else {
      actual = {name:l.replace(/:$/,''), options:[]};
      courses.push(actual);
    }
  }
  return courses.filter(function(c){ return c.options.length; });
}

    AVISOS.appendChild(h('div', {class:'aviso',
      text:'Falta configurar la clave de Supabase en index.html. Nada se va a guardar todavía.'}));

           'de un visor de archivos, ni en una ventana privada.'}));
  }
  if(!YO){

    return vistaRegistro(APP);

  PESTANAS.hidden = false;

  if(VISTA.pantalla === 'diagnostico') return vistaDiagnostico(APP);
  if(VISTA.pantalla === 'org')         return ORG ? vistaOrg(APP) : vistaAjustes(APP);

  Array.prototype.forEach.call(PESTANAS.querySelectorAll('button[data-tab]'), function(b){
    if(b.getAttribute('data-tab') === VISTA.tab) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  if(VISTA.tab === 'hoy')     return vistaHoy(APP);
  if(VISTA.tab === 'grupo')   return vistaGrupo(APP);
  if(VISTA.tab === 'pasadas') return vistaPasadas(APP);
}

    var t = b.getAttribute('data-tab');
    if(VISTA.tab === t && !VISTA.pantalla){
      // Volver al listado si ya estábamos en la pestaña.
      VISTA.menu = null; VISTA.pasada = null;
    }
    VISTA.tab = t; VISTA.pantalla = null;
    if(t !== 'hoy') VISTA.menu = null;
    if(t !== 'pasadas') VISTA.pasada = null;
    render();
  });
});

// Cuenta regresiva: solo cambia el texto de los chips, cada 20 s.
function tictac(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-cd]'), function(n){
    var ms = n.getAttribute('data-cd');
    if(!ms) return;
    var t = textoCuenta(Number(ms));
    if(n.textContent !== t) n.textContent = t;
  });
}
setInterval(tictac, 20000);

// Al volver del segundo plano, refresca por si ya cerró.
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && STATE){ tictac(); }
});

cargarEstado().then(function(){
  return subirPendientes().catch(function(){});
}).then(function(){
  render();
}, function(e){
  APP.textContent = '';
  APP.appendChild(h('div', {class:'aviso', text:'No pudimos arrancar: ' + errTexto(e)}));
  APP.appendChild(h('button', {class:'btn sec', onclick:function(){ location.reload(); }}, 'Reintentar'));
});
</script>
